seed_playbook:
  - "Reply bám đúng một chi tiết cụ thể của bài đang nhiều người bàn (trên 50 reply) nhận được nhiều reply và view hơn là tự đăng một bài cùng ý."
  - "Reply trong 60 phút đầu dưới bài của tài khoản có follower gấp 2–10 lần mình, kèm một chi tiết cụ thể của bài đó, kéo được nhiều lượt xem profile và follower hơn reply muộn hoặc dưới tài khoản lớn hơn nhiều."
  - "Post giọng giáo sư biết tuốt phán một câu chắc nịch về chuyện đang hot nhận được nhiều reply và follower hơn post kể chuyện đời thường không gắn trend."
  - "Hook kiểu number (dòng đầu là một con số tiền hoặc số lần nhỏ và thật) nhận nhiều reply hơn post mở bằng nhận định chung."
  - "Hook kiểu contrarian (dòng đầu ngược với điều ai cũng nói về giá, app, AI) nhận nhiều reply hơn post đồng tình với điều đó."
  - "Hook kiểu curiosity_gap (dòng đầu là câu hở, dòng sau trả lời thật) nhận nhiều view và reply hơn post nói thẳng kết luận ở dòng đầu."
  - "Hook kiểu personal_stake (dòng đầu là một việc mình đã trải qua hay đã trả tiền cho) nhận nhiều reply hơn post bình luận từ ngoài."
  - "Hook kiểu trend_detail (dòng đầu là tên app, mức giá hay tính năng người thường đang dùng) nhận nhiều view hơn post nhắc chủ đề chung chung."
  - "Post một dòng 40–80 ký tự nhận nhiều view và reply hơn post từ ba dòng trở lên cùng chủ đề; series 2–3 phần chỉ đáng giữ khi phần 1 tự đứng được."
llm:
  protocol: openai
  base_url: https://api.openai.com/v1
  model: gpt-6-luna
  api_key_env: OPENAI_API_KEY
  reasoning_effort: none           # gpt-6-luna allows function tools only at effort none
  price_per_mtok_in_usd: 0.10      # OpenAI Standard short-context input rate (2026-11-12)
  price_per_mtok_out_usd: 0.50     # OpenAI Standard short-context output rate (2026-11-12)
writer:                           # drafts every post and reply from the agent's brief; no tools, so it can reason
  llm:
    protocol: openai
    base_url: https://api.openai.com/v1
    model: gpt-6-luna
    api_key_env: OPENAI_API_KEY
    reasoning_effort: high
    price_per_mtok_in_usd: 0.10
    price_per_mtok_out_usd: 0.50
  post_llm:                       # posts only: in the owner's blind vote sol beat luna on posts (66% vs 50%), barely on replies
    protocol: openai
    base_url: https://api.openai.com/v1
    model: gpt-6.1-sol
    api_key_env: OPENAI_API_KEY
    reasoning_effort: high
    price_per_mtok_in_usd: 2.00    # OpenAI Standard short-context input rate (2026-11-13)
    price_per_mtok_out_usd: 10.00  # OpenAI Standard short-context output rate (2026-11-13)
critic:                           # reviews every draft before the guard; defaults to the llm block
  llm:
    protocol: openai
    base_url: https://api.openai.com/v1
    model: gpt-6-luna
    api_key_env: OPENAI_API_KEY
    reasoning_effort: high
    price_per_mtok_in_usd: 0.10
    price_per_mtok_out_usd: 0.50
limits:                           # starting values, no experimental basis
  posts_per_day: 6
  replies_per_day: 80             # anti-spam ceiling only; the daily budget sets the real volume
  browser_replies_per_day: 80     # replies under other people's posts go through the browser
  critic_rejections_per_wake: 5
  replies_per_user_7d: 2
  min_seconds_between_actions: 150
  min_minutes_between_posts: 120  # 6 posts spread over the waking day, not two in one wake
  max_steps_per_wake: 45
  max_usd_per_day: 2.00           # owner cap for the live viral account
  max_usd_per_dream: 0.30         # nightly dream has its own cap, outside the daily cap
  max_steps_per_dream: 20
  min_minutes_between_wakes: 20
  explore_percent: 30            # share of the last 20 actions the agent may mark explore
learning:
  min_effect: 0.2                 # smallest mean lift (log scale, 0.2 is about +22%) a hypothesis needs to be established
kpi:                              # pressure: the scoreboard in every wake shows these; code sets the wake cadence from the gap
  engagements_per_day: 10         # likes + replies + reposts + quotes on own actions in 24h
  followers_per_week: 5
  max_hours_without_publish: 8
  on_target_minutes_between_wakes: 180   # when behind, the wait is limits.min_minutes_between_wakes
schedule:                         # local-time phases
  timezone: Asia/Ho_Chi_Minh
  dream_at: "00:30"               # once per local day, after the evening peak so its metrics exist
  quiet_from: "01:00"             # no agent wake in the night; the next one waits for quiet_until
  quiet_until: "07:00"               # once per local day; a missed one runs once on next start
  study_slots:                    # minimum "đi học" cadence; spikes can add sessions
    - "09:00"
    - "15:00"
    - "20:30"
trends:                           # deterministic fetch_trends ranking, no extra LLM call
  sources:                        # what a Vietnamese GenZ reader lives in
    - google_trends
    - google_news_vn
    - vnexpress
  avoid_keywords:
    - "crypto"
    - "coin"
    - "airdrop"
    - "khoá học làm giàu"
targets:                          # the window of a good reply target; outside it a post is flagged and scores low
  max_age_minutes: 180            # a rising post a few hours old still has an audience
  max_replies: 20                 # past this the reply sinks below the fold
  min_likes_per_hour: 10          # slower than this is not rising
  min_likes: 50                   # a post needs some traction before a reply is worth it
inbox:
  poll_minutes: 10                # code looks for new replies to us between wakes and wakes the agent early (0 turns it off)
  min_minutes_after_wake: 5       # an early wake starts at least this long after the last one started
study:
  sources:                        # credential-free except optional Reddit
    - google_news_vn
    - google_news_global
    - google_news_topics
    - vnexpress
    - genk
    - tinhte
    - vietnamnet
    - the_verge
    - techcrunch
    - arstechnica
    - hacker_news
    - product_hunt
    - google_trends
    - reddit_localllama           # skipped unless REDDIT_CLIENT_ID/SECRET are set
    - reddit_openai
    - reddit_singularity
    - github_trending
    - youtube
  threads_sample:                 # bounded, paced read-only Threads sampling
    max_reads: 4
    pause_ms: 1500
    keywords:
      - "AI thay dev"
      - "agent tự động"
      - "vibe code"
  min_minutes_between_sessions: 120
  max_sessions_per_day: 8
  spike_multiplier: 2.0
  spike_min_score: 6
  web_search:                     # optional bounded OpenAI Responses web search
    enabled: true
    model: gpt-6-luna
    max_results: 5
    max_output_tokens: 512
threads:
  username: giaosullm # operator-owned throwaway account; never inferred from the persona name.
  backend: stub # Live use is backend: api with THREADS_ACCESS_TOKEN, THREADS_USER_ID and THREADZ_SECRET_KEY set.
  profile_dir: data/profiles/viral
telegram:
  digest_hour: 18 # UTC, once per agent/day
  enabled: false # Local default; set true to require the owner integration credentials.
  bot_token_env: TELEGRAM_BOT_TOKEN
  owner_chat_id_env: TELEGRAM_OWNER_CHAT_ID
  # Owner-facing copy in the professor's voice. Only code-owned facts and
  # persona fields are available; a missing kind falls back to neutral copy.
  messages:
    digest: "hôm nay tôi đăng {{.Posts}}{{if .PostsLimit}}/{{.PostsLimit}}{{end}} bài, reply {{.Replies}}{{if .RepliesLimit}}/{{.RepliesLimit}}{{end}}, xài {{.Cost}}{{if .Budget}} trên {{.Budget}}{{end}}.{{if .HasPhaseSpend}}{{nl}}chia ra: thức {{.WakeCost}} · bắt trend {{.StudyCost}} · mơ {{.DreamCost}}{{end}}{{if .HasMetrics}}{{nl}}số liệu mới nhất: {{.Views}} view, {{.Likes}} like, {{.Responses}} reply, {{.Reposts}} repost.{{end}}{{if .Playbook}}{{nl}}playbook sửa {{.Playbook}} chỗ.{{end}}{{if .NotRunning}}{{nl}}{{.StatusText}}.{{end}}{{if .NextWake}}{{nl}}{{.NextWake}} ({{.NextIn}}) tôi chạy tiếp.{{end}}"
    status: "{{.StatusText}}.{{if .NextWake}}{{nl}}lần chạy tới: {{.NextWake}} ({{.NextIn}}){{else}}{{nl}}chưa hẹn lần nào tiếp{{end}}{{nl}}hôm nay: {{.Posts}}{{if .PostsLimit}}/{{.PostsLimit}}{{end}} bài · {{.Replies}}{{if .RepliesLimit}}/{{.RepliesLimit}}{{end}} reply · {{.Cost}}{{if .Budget}}/{{.Budget}}{{end}}{{if .HasPhaseSpend}}{{nl}}chia ra: thức {{.WakeCost}} · bắt trend {{.StudyCost}} · mơ {{.DreamCost}}{{end}}{{if .HasMetrics}}{{nl}}số liệu: {{.Views}} view · {{.Likes}} like · {{.Responses}} reply · {{.Reposts}} repost{{end}}{{if .Playbook}}{{nl}}playbook: {{.Playbook}} chỗ vừa sửa{{end}}"
    pause: "ừ, tôi nghỉ. gõ /resume khi muốn tôi chạy tiếp."
    resume: "tôi dậy rồi, chạy tiếp."
    kill: "tắt thì tắt. /resume không cứu được tôi đâu."
    dnc: "ok, tôi không đụng @{{.Username}} nữa. ghi sổ rồi."
    help: "lệnh điều khiển:{{nl}}/status — xem tôi đang làm gì{{nl}}/pause — cho tôi nghỉ{{nl}}/resume — gọi tôi dậy{{nl}}/kill — tắt hẳn, không bật lại được{{nl}}/dnc {{if .MultiAgent}}<agent_id> {{end}}<username> — tôi né username đó"
    note_ack: "ghi rồi. lần dậy tới tôi đọc."
    question_hint: "↩️ trả lời ngay tin này để tôi nhận được"
    notice: "{{.Notice}}. tôi xử lý theo sổ."
dry_run: true
